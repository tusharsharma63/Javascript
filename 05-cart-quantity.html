<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>
      Cart Quantity
    </p>

    <button onclick="
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Show Quantity
    </button>

    <button onclick="
    cartQuantity++;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Add to Cart
    </button>

    <button onclick="
    cartQuantity += 2;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      +2
    </button>

    <button onclick="
    cartQuantity += 3;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      +3
    </button>

    <button onclick="
    cartQuantity += 4;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      +4
    </button>

    <button onclick="
    cartQuantity += 5;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      +5
    </button>

    <button onclick="
    cartQuantity--;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Remove from cart
    </button>

    <button onclick="
    cartQuantity -= 2;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      -2
    </button>

    <button onclick="
    cartQuantity -= 3;
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      -3
    </button>

    <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset.');
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Reset Cart
    </button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
