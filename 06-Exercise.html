<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Exercise</title>
  </head>
  <body>
    <script>
      // EXERCISE 1:
      let hour = 15;

      if (hour >= 6 && hour < 12) {
        console.log('Good morning');
      } else if (hour >= 12 && hour < 17) {
        console.log('Good afternoon');
      } else {
        console.log('Good night');
      }

      hour = 10;

      if (hour >= 6 && hour < 12) {
        console.log('Good morning');
      } else if (hour >= 12 && hour < 17) {
        console.log('Good afternoon');
      } else {
        console.log('Good night');
      }

      let name = 'Tushar Sharma';

      if (hour >= 6 && hour < 12) {
        console.log(`Good morning ${name}!`);
      } else if (hour >= 12 && hour < 17) {
        console.log(`Good afternoon ${name}!`);
      } else {
        console.log(`Good night ${name}!`);
      }

      // EXERCISE 2:
      let age = 28;

      if (age <= 6 || age >= 65) {
        console.log('Discount');
      } else {
        console.log('No discount');
      }

      age = 25;

      const isHoliday = false;
      if (isHoliday === false && age <= 6 || isHoliday === false && age >= 65) {
        console.log('Discount');
      } else {
        console.log('No discount');
      }
    </script>
  </body>
</html>
