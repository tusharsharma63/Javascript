<!DOCTYPE html>
<html>
  <head>
    <title>Coin Flip Game</title>
  </head>
  <body>
    <script>
      const randomnumber = Math.random();

      const result = randomnumber >= 0.5 ? 'heads' : 'tails';

      const guess = 'tails';

      result === guess ? console.log('You win') : console.log('You lose');
    </script>
  </body>
</html>
