<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>
      Cart Quantity
    </p>

    <button onclick="
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Show Quantity
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(1)}`);"
    style="cursor: pointer;">
      Add to Cart
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(2)}`);"
    style="cursor: pointer;">
      +2
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(3)}`);"
    style="cursor: pointer;">
      +3
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(4)}`);"
    style="cursor: pointer;">
      +4
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(5)}`);"
    style="cursor: pointer;">
      +5
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(-1)}`);"
    style="cursor: pointer;">
      Remove from cart
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(-2)}`);"
    style="cursor: pointer;">
      -2
    </button>

    <button onclick="
    console.log(`Cart Quantity: ${updateCartQuantity(-3)}`);"
    style="cursor: pointer;">
      -3
    </button>

    <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset.');
    console.log(`Cart Quantity: ${cartQuantity}`);"
    style="cursor: pointer;">
      Reset Cart
    </button>

    <script>
      let cartQuantity = 0;

      function updateCartQuantity(n) {
        if (cartQuantity + n > 10) {
          alert('The cart is full.');
          return;
        } else if (cartQuantity + n < 0) {
          alert('Not enough items in the cart.');
          return;
        } else {
          cartQuantity += n;
          return cartQuantity;
        }
      }
    </script>
  </body>
</html>
