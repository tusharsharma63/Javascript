<!DOCTYPE html>
<html>
  <head>
    <title>Coin Flip Game</title>
  </head>
  <body>
    <button onclick="
    playGame('heads');
    ">
      Heads
    </button>

    <button onclick="
    playGame('tails');
    ">
      Tails
    </button>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    localStorage.removeItem('score');
    ">
      Reset Score
    </button>
    
    <script>
      let score = JSON.parse(localStorage.getItem('score')) ||
      {
        wins: 0,
        losses: 0
      };

      function playGame(guess) {
      const computerMove = computerChoice();

      let result = '';

      if (computerMove === guess) {
        result = 'You win';
        score.wins++;  
      } else if (computerMove !== guess) {
        result = 'You lose';
        score.losses++;
      }

      localStorage.setItem('score', JSON.stringify(score));

      alert(`Your guess ${guess}. Computer's choice ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}`);
      }

      function computerChoice() {
      const randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber >= 0.5) {
        computerMove = 'heads';
      } else if (randomNumber < 0.5) {
        computerMove = 'tails';
      }

      return computerMove;
      }
    </script>
  </body>
</html>
