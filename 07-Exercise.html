<!DOCTYPE html>
<html>
  <head>
    <title>Functions Exercise</title>
  </head>
  <body>
    <script>
      // EXERCISE 1:
      function greet(name) {
        if (!name) {
        console.log('Hi there!');
        } else {
          console.log(`Hello ${name}!`);
        }
      }

      greet('Tushar Sharma');
      greet();

      // EXERCISE 2
      function convertToFahrenheit(Celcius) {
        const fahrenheit = (Celcius * 9 / 5) + 32;
        return fahrenheit;
      }

      console.log(convertToFahrenheit(25));

      function convertToCelcius(Fahrenheit) {
        const celcius = (Fahrenheit - 32) * 5 / 9;
        return celcius;
      }

      console.log(convertToCelcius(86));

      function convertTemperature(degrees, unit) {
        if (unit === 'C') {
          const fahrenheit = convertToFahrenheit(degrees);
          return fahrenheit;
        } else if (unit === 'F') {
          const celcius = convertToCelcius(degrees);
          return celcius;
        }
      }

      console.log(`${convertTemperature(25, 'C')}C`);
      console.log(`${convertTemperature(86, 'F')}F`);

      // EXERCISE 3:
      function convertLength(length, from, to) {
        if (from === 'miles' && to === 'km') {
          const lengthInKm = length * 1.6;
          return lengthInKm;
        } else if (from === 'miles' && to === 'ft') {
          const lengthInFt = length * 5280;
          return lengthInFt;
        } else if (from === 'km' && to === 'ft') {
          const lengthInFt = length * 3281;
          return lengthInFt;
        } else if (from !== 'miles' || from !== 'km' || from !== 'ft') {
          return `Invalid unit: ${from}`;
        } else if (to !== 'miles' || to !== 'km' || to !== 'ft') {
          return `Invalid unit: ${to}`;
        }
      }

      console.log(`${convertLength(50, 'miles', 'km')} km`);
      console.log(`${convertLength(5, 'miles', 'ft')} ft`);
      console.log(`${convertLength(5, 'km', 'ft')} ft`);
      console.log(convertLength(5, 'ibs', 'ibs'));
    </script>
  </body>
</html>
