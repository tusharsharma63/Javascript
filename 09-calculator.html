<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
  </head>
  <body>
    <p class="js-calculation"></p>

    <p>
      <button onclick="
      updateCalculation('1');">
      1
    </button>

    <button onclick="
      updateCalculation('2');">
      2
    </button>

    <button onclick="
      updateCalculation('3');">
      3
    </button>
    </p>

    <p>
    <button onclick="
      updateCalculation('4');">
      4
    </button>

    <button onclick="
      updateCalculation('5');">
      5
    </button>

    <button onclick="
      updateCalculation('6');">
      6
    </button>
    </p>

    <p>
      <button onclick="
      updateCalculation('7');">
      7
    </button>

    <button onclick="
      updateCalculation('8');">
      8
    </button>

    <button onclick="
      updateCalculation('9');">
      9
    </button>
    </p>

    <p>
    <button onclick="
      updateCalculation('0');">
      0
    </button>

    <button onclick="
    updateCalculation('+');">
      +
    </button>

    <button onclick="
    calculation = eval(calculation);
    document.querySelector('.js-calculation')
      .innerHTML = calculation;
    localStorage.setItem('calculation', JSON.stringify(calculation));">
      =
    </button>
    </p>

    <button onclick="
    calculation = '';
    localStorage.removeItem('calculation');
    document.querySelector('.js-calculation').innerHTML = '';">
      AC
    </button>

    <script>
      let calculation = localStorage.getItem('calculation') || 
      '';

      document.querySelector('.js-calculation')
        .innerHTML = calculation;

      function updateCalculation(n) {
        calculation += n;
        document.querySelector('.js-calculation')
          .innerHTML = calculation;
        localStorage.setItem('calculation', calculation);
        return calculation;
      }
    </script>
  </body>
</html>
